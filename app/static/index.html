<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkpoint · AP invoice review</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23005AFC'/%3E%3Cpath d='M7 12.5l3 3 7-7' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="frame"><div class="shell">
  <header class="top">
    <a href="#/" class="logo" aria-label="Checkpoint home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </a>
    <span class="brandname">Checkpoint</span>
    <label class="pillbtn" for="topUpload" style="cursor:pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"></path></svg>
      Upload invoice PDF
    </label>
    <input type="file" id="topUpload" accept="application/pdf" class="sr">
    <a class="btn white" href="#/review" id="topQueue"><span class="dot" style="background:var(--hold)"></span><span id="topQueueText">Review queue</span></a>
    <span class="spacer"></span>
    <span class="datepill"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg><span id="today"></span></span>
    <a class="btn primary" href="#/">New run <span aria-hidden="true">→</span></a>
  </header>

  <div class="body">
    <aside class="side" aria-label="Main navigation">
      <div class="title">AP invoice review</div>
      <a class="nav" href="#/" data-nav="new"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New run</a>
      <a class="nav" href="#/dashboard" data-nav="dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path></svg>Dashboard</a>
      <a class="nav" href="#/review" data-nav="review"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c1.2-3.5 4-5 7-5s5.8 1.5 7 5"></path></svg>Review queue<span class="count" id="navQueue">0</span></a>
      <a class="nav" href="#/reference" data-nav="reference"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>Reference data</a>
      <a class="nav" href="#/rules" data-nav="rules"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg>Rules &amp; assumptions</a>
      <hr>
      <div class="label">Outcomes so far</div>
      <div class="outcome"><span class="sq" style="background:var(--ok)"></span>Approved<b id="oA">0</b></div>
      <div class="outcome"><span class="sq" style="background:var(--hold)"></span>On hold<b id="oH">0</b></div>
      <div class="outcome"><span class="sq" style="background:var(--bad)"></span>Rejected<b id="oR">0</b></div>
      <div class="aicard">
        <div style="font-weight:600">AI readers</div>
        <div class="muted" style="font-size:12px;margin-top:2px">Tried in order — if one is busy, the next takes over.</div>
        <div id="aiRows"></div>
      </div>
      <div class="me"><span class="avatar">AP</span><div><div style="font-weight:500">AP reviewer</div><div class="muted" style="font-size:12px">Kestrel Foods Pvt Ltd</div></div></div>
    </aside>
    <main id="view"></main>
  </div>
</div></div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden></div>
<script src="/app.js"></script>
</body>
</html>
